name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [staging, production]

concurrency:
  # Never let two deployments race onto the same App Service.
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for OIDC federated login to Azure — no long-lived secrets.
  id-token: write

env:
  NODE_VERSION: '22.x'
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  # Deploying to a slot and swapping gives a zero-downtime release and an
  # instant rollback path. Set the AZURE_WEBAPP_SLOT variable to 'staging'.
  AZURE_WEBAPP_SLOT: ${{ vars.AZURE_WEBAPP_SLOT || 'production' }}

jobs:
  build:
    name: Build deployment package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify before packaging
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Build
        run: npm run build

      # App Service runs the compiled output directly, so the package must
      # contain production node_modules. Pruning dev dependencies here keeps
      # the artifact small and removes build tooling from the running app.
      - name: Prune to production dependencies
        run: npm prune --omit=dev

      - name: Assemble deployment package
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp -r node_modules deploy/
          cp package.json deploy/
          cp package-lock.json deploy/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: deploy/
          retention-days: 5
          include-hidden-files: false

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      # Federated (OIDC) credentials — no publish profile or client secret is
      # stored in GitHub. Configure a federated credential on the App
      # Registration for this repository/environment.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_WEBAPP_SLOT }}
          package: app
          # The platform must not try to build: we ship a compiled artifact
          # with production node_modules already installed.
          startup-command: 'node dist/index.js'

      # Confirms the instance is actually serving before the job goes green.
      # `/health` is unauthenticated and makes no HubSpot call by design.
      - name: Smoke test health endpoint
        run: |
          BASE_URL="${{ steps.deploy.outputs.webapp-url }}"
          echo "Probing $BASE_URL/health"

          for attempt in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$BASE_URL/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Healthy after ${attempt} attempt(s):"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code}; retrying in 10s"
            sleep 10
          done

          echo "Health check never succeeded." >&2
          exit 1

      # Verifies the HubSpot credential in the deployed environment. Requires
      # MCP_SMOKE_API_KEY to match the app's MCP_API_KEY setting. Non-blocking:
      # a HubSpot outage should not fail an otherwise good deployment.
      - name: Smoke test HubSpot connectivity
        continue-on-error: true
        env:
          MCP_SMOKE_API_KEY: ${{ secrets.MCP_SMOKE_API_KEY }}
        run: |
          if [ -z "$MCP_SMOKE_API_KEY" ]; then
            echo "MCP_SMOKE_API_KEY not set; skipping HubSpot connectivity check."
            exit 0
          fi

          BASE_URL="${{ steps.deploy.outputs.webapp-url }}"
          code=$(curl -s -o /tmp/ping.json -w "%{http_code}" \
            -H "x-api-key: $MCP_SMOKE_API_KEY" \
            "$BASE_URL/ping/hubspot")

          cat /tmp/ping.json
          if [ "$code" != "200" ]; then
            echo "::warning::HubSpot connectivity check returned HTTP ${code}."
          fi

      - name: Azure logout
        if: always()
        run: az logout || true
