# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# This file was originally auto-generated by Azure Portal's Deployment Center.
# It has been hardened here — the generated version had three problems:
#
#   1. It uploaded the entire working directory (`.git`, `src/`, test files,
#      full node_modules with devDependencies) as the deploy artifact. That
#      is slow, and ships far more than a running server needs.
#   2. It never set a Startup Command, so App Service fell back on whatever
#      was already configured in the Portal — which may not exist or may be
#      stale from an earlier attempt.
#   3. `.github/workflows/deploy-azure.yml` also triggers on every push to
#      `main` and deploys the same App Service by a different mechanism
#      (OIDC login instead of a publish profile). Two workflows racing to
#      deploy the same target on every push is what "occasionally works,
#      occasionally doesn't" looks like. That workflow's trigger has been
#      restricted to manual dispatch so only this one deploys automatically;
#      switch back once its OIDC secrets (AZURE_CLIENT_ID, AZURE_TENANT_ID,
#      AZURE_SUBSCRIPTION_ID) are configured, if you prefer that path.

name: Build and deploy Node.js app to Azure Web App - HubspotMCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main_hubspotmcp-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, and test
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Build
        run: npm run build

      # The App Service container runs the compiled output directly, so the
      # artifact needs production node_modules alongside it — but nothing
      # else. Pruning here (rather than shipping full node_modules and
      # letting Oryx rebuild) is what makes NODE_ENV=production safe to set
      # as an App Setting: Oryx never needs to run `npm install` itself, so
      # there is no devDependency-skipping build step for that setting to
      # break.
      - name: Prune to production dependencies
        run: npm prune --omit=dev

      - name: Assemble deployment package
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp -r node_modules deploy/
          cp package.json deploy/
          cp package-lock.json deploy/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy/
          include-hidden-files: false

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'HubspotMCP'
          slot-name: 'Production'
          package: deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_3187F4A0AD4B4125A35786E0B6FFA94F }}
          # Explicit rather than relying on whatever the Portal happens to
          # have configured. dist/index.js is the compiled entry point.
          startup-command: 'node dist/index.js'

      # `/health` answers from process state alone — no HubSpot call, no
      # auth required — so it is safe to use as a deploy-succeeded check.
      - name: Smoke test health endpoint
        run: |
          BASE_URL="${{ steps.deploy-to-webapp.outputs.webapp-url }}"
          echo "Probing $BASE_URL/health"

          for attempt in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$BASE_URL/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Healthy after ${attempt} attempt(s):"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${code}; retrying in 10s"
            sleep 10
          done

          echo "Health check never succeeded — see the App Service log stream (az webapp log tail) for the actual crash reason." >&2
          exit 1
