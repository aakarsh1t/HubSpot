name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.x'

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 is the deployment target (Azure App Service LTS); 24 is an early
        # warning for the next LTS, so an upgrade is never a surprise.
        node-version: ['22.x', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` (not `install`) so the lockfile is authoritative and a
      # transitive dependency cannot drift between CI and production.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage
        env:
          # Configuration is validated at import time by some tests; these keep
          # the suite hermetic and free of real credentials.
          NODE_ENV: test

      - name: Build
        run: npm run build

      # Boots the actual compiled artifact and confirms it answers /health,
      # rather than merely importing it. An import-only check would not exit
      # on success either: the HTTP listener keeps the event loop alive, so a
      # bare `import()` would leave this step hanging until the job timeout
      # instead of passing. Starting it as a background process and polling
      # is what makes this both a real check and one that terminates.
      - name: Verify build output boots and serves traffic
        run: |
          NODE_ENV=test \
          MCP_AUTH_ENABLED=false \
          HUBSPOT_AUTH_MODE=private_app \
          HUBSPOT_PRIVATE_APP_TOKEN=fake-hubspot-private-app-token-for-ci \
          PORT=8099 \
          LOG_LEVEL=silent \
          node dist/index.js &
          SERVER_PID=$!

          # Guarantees the background server is killed however this step
          # ends — success, failure, or the step timeout — so it can never
          # leak a listening process into the rest of the job.
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8099/health > /dev/null; then
              echo "Boot verification succeeded after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 0.5
          done

          echo "dist/index.js did not become healthy within the timeout." >&2
          exit 1

      - name: Upload coverage
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the build on high/critical advisories only: blocking every PR on
      # a low-severity transitive advisory trains people to ignore the signal.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
